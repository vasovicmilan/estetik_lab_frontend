<header class="header">
  <a class="header__brand" routerLink="/">Estetik Lab</a>

  <nav class="header__nav">
    <a routerLink="/usluge" routerLinkActive="header__link--active" class="header__link">Usluge</a>
    <a routerLink="/paketi" routerLinkActive="header__link--active" class="header__link">Paketi</a>
    <a routerLink="/tim" routerLinkActive="header__link--active" class="header__link">Naš tim</a>
    <a routerLink="/blog" routerLinkActive="header__link--active" class="header__link">Blog</a>
    <a routerLink="/prodavnica" routerLinkActive="header__link--active" class="header__link">Prodavnica</a>

    @if (auth.hasAnyAdminAccess()) {
      <a routerLink="/admin" routerLinkActive="header__link--active" class="header__link"> Admin </a>
    }

    @if (auth.currentUser()?.isEmployee) {
      <a routerLink="/zaposleni-panel" routerLinkActive="header__link--active" class="header__link">Panel zaposlenog</a>
    }

    @if (auth.currentUser()?.isPartner) {
      <a routerLink="/partner-panel" routerLinkActive="header__link--active" class="header__link">Panel partnera</a>
    }

    <a routerLink="/korpa" routerLinkActive="header__link--active" class="header__link header__link--cart" aria-label="Korpa">
      <mat-icon>shopping_cart</mat-icon>
    </a>

    @if (auth.currentUser(); as user) {
      <a routerLink="/moj-nalog" routerLinkActive="header__link--active" class="header__user" title="Moj nalog">{{ user.email }}</a>
      <button mat-button (click)="logout()">Odjava</button>
    } @else {
      <a mat-button routerLink="/prijava">Prijava</a>
    }
  </nav>
</header>
