<div class="admin-logs-history-list">
  <div class="admin-logs-history-list__header">
    <h1>Istorija izveštaja o logovima</h1>
    <a mat-button routerLink="/admin/logovi">Nazad na logove</a>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [error]="error()"
    emptyLabel="Nema sačuvanih izveštaja."
    [totalCount]="meta()?.total ?? 0"
    [pageSize]="meta()?.limit ?? 20"
    [pageIndex]="(meta()?.page ?? 1) - 1"
    [pageSizeOptions]="[10, 20, 50, 100]"
    [defaultSort]="defaultSort"
    [actions]="actions"
    (pageChange)="onPage($event)"
    (sortChange)="onSort($event)"
    (retry)="load(meta()?.page ?? 1)"
  />
</div>
