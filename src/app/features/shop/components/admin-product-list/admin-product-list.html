<div class="admin-product-list">
  <div class="admin-product-list__header">
    <h1>Proizvodi</h1>
    <a mat-flat-button color="primary" routerLink="/admin/prodavnica/novi">Novi proizvod</a>
  </div>

  <div class="admin-product-list__taxonomy-links">
    <a routerLink="/admin/kategorije">Upravljaj kategorijama</a>
    <a routerLink="/admin/tagovi">Upravljaj tagovima</a>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [error]="error()"
    emptyLabel="Nema proizvoda."
    [totalCount]="meta()?.total ?? 0"
    [pageSize]="meta()?.limit ?? 10"
    [pageIndex]="(meta()?.page ?? 1) - 1"
    [pageSizeOptions]="[10, 25, 50, 100]"
    [defaultSort]="defaultSort"
    [actions]="actions"
    [searchable]="true"
    searchPlaceholder="Pretraga proizvoda..."
    (pageChange)="onPage($event)"
    (searchChange)="onSearch($event)"
    (sortChange)="onSort($event)"
    (retry)="load(meta()?.page ?? 1)"
  >
    <ng-template appDataTableCellDef="slika" let-row>
      @if ($any(row).slika?.url) {
        <img [src]="$any(row).slika.url | imageUrl" alt="" width="48" height="48" style="object-fit: cover; border-radius: 4px;" />
      }
    </ng-template>
  </app-data-table>
</div>
