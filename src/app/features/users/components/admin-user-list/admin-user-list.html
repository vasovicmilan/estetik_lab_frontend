<div class="admin-user-list">
  <div class="admin-user-list__header">
    <h1>Korisnici</h1>
  </div>

  <form [formGroup]="filterForm" class="admin-user-list__filters">
    <mat-form-field appearance="outline">
      <mat-label>Pretraga</mat-label>
      <input matInput formControlName="search" placeholder="Ime, email..." />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        @for (option of statusOptions; track option.value) {
          <mat-option [value]="option.value">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [error]="error()"
    emptyLabel="Nema korisnika koji odgovaraju filterima."
    [totalCount]="meta()?.total ?? 0"
    [pageSize]="meta()?.limit ?? 10"
    [pageIndex]="(meta()?.page ?? 1) - 1"
    [pageSizeOptions]="[10, 25, 50, 100]"
    [actions]="actions"
    (pageChange)="onPage($event)"
    (sortChange)="onSort($event)"
    (retry)="load(meta()?.page ?? 1)"
  >
    <ng-template appDataTableCellDef="slika" let-row>
      @if ($any(row).slika?.url) {
        <img [src]="$any(row).slika!.url | imageUrl" [alt]="$any(row).imePrezime" class="admin-user-list__avatar" />
      }
    </ng-template>
    <ng-template appDataTableCellDef="status" let-row>
      <span [class]="statusClass($any(row).statusRaw)">{{ $any(row).status }}</span>
    </ng-template>
  </app-data-table>
</div>
