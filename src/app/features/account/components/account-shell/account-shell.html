<div class="account-shell">
  <h1 class="account-shell__title">Moj nalog</h1>

  <nav mat-tab-nav-bar [tabPanel]="accountTabPanel" class="account-shell__nav">
    <a
      mat-tab-link
      routerLink="/moj-nalog"
      routerLinkActive
      #profilLink="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      [active]="profilLink.isActive"
      >Profil</a
    >
    <a mat-tab-link routerLink="/moj-nalog/zakazivanja" routerLinkActive #zakazivanjaLink="routerLinkActive" [active]="zakazivanjaLink.isActive"
      >Moja zakazivanja</a
    >
    <a mat-tab-link routerLink="/moj-nalog/porudzbine" routerLinkActive #porudzbineLink="routerLinkActive" [active]="porudzbineLink.isActive"
      >Moje porudžbine</a
    >
    <a mat-tab-link routerLink="/moj-nalog/adrese" routerLinkActive #adreseLink="routerLinkActive" [active]="adreseLink.isActive"
      >Moje adrese</a
    >
  </nav>

  <mat-tab-nav-panel #accountTabPanel class="account-shell__body">
    <router-outlet />
  </mat-tab-nav-panel>
</div>
