<div class="admin-coupon-list">
  <div class="admin-coupon-list__header">
    <h1>Kuponi</h1>
    <a mat-flat-button color="primary" routerLink="/admin/kuponi/novi">Novi kupon</a>
  </div>

  <form [formGroup]="filterForm" class="admin-coupon-list__filters">
    <mat-form-field appearance="outline">
      <mat-label>Pretraga</mat-label>
      <input matInput formControlName="search" placeholder="Kod kupona..." />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select formControlName="isActive">
        @for (option of activeOptions; track option.value) {
          <mat-option [value]="option.value">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [error]="error()"
    emptyLabel="Nema kupona koji odgovaraju filterima."
    [totalCount]="meta()?.total ?? 0"
    [pageSize]="meta()?.limit ?? 10"
    [pageIndex]="(meta()?.page ?? 1) - 1"
    [pageSizeOptions]="[10, 25, 50, 100]"
    [actions]="actions"
    (pageChange)="onPage($event)"
    (sortChange)="onSort($event)"
    (retry)="load(meta()?.page ?? 1)"
  />
</div>
