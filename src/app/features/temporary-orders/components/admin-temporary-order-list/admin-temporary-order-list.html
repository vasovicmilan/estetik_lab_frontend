<div class="admin-temporary-order-list">
  <div class="admin-temporary-order-list__header">
    <h1>Privremene porudžbine</h1>
  </div>

  <form [formGroup]="filterForm" class="admin-temporary-order-list__filters">
    <mat-form-field appearance="outline">
      <mat-label>Pretraga</mat-label>
      <input matInput formControlName="search" placeholder="Ime, email..." />
    </mat-form-field>
  </form>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [error]="error()"
    emptyLabel="Nema privremenih porudžbina koje odgovaraju pretrazi."
    [totalCount]="meta()?.total ?? 0"
    [pageSize]="meta()?.limit ?? 10"
    [pageIndex]="(meta()?.page ?? 1) - 1"
    [pageSizeOptions]="[10, 25, 50, 100]"
    [defaultSort]="defaultSort"
    [actions]="actions"
    [searchable]="false"
    (pageChange)="onPage($event)"
    (sortChange)="onSort($event)"
    (retry)="load(meta()?.page ?? 1)"
  >
    <ng-template appDataTableCellDef="zahtevaProceenuDostave" let-row>
      <span
        class="admin-temporary-order-list__badge"
        [class.admin-temporary-order-list__badge--attention]="$any(row).zahtevaProceenuDostave === 'Da'"
      >
        {{ $any(row).zahtevaProceenuDostave }}
      </span>
    </ng-template>
  </app-data-table>
</div>
