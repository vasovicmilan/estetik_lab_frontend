<div class="admin-package-list">
  <div class="admin-package-list__header">
    <h1>Paketi</h1>
    <a mat-flat-button color="primary" routerLink="/admin/paketi/novi">Novi paket</a>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [error]="error()"
    emptyLabel="Nema paketa."
    [totalCount]="meta()?.total ?? 0"
    [pageSize]="meta()?.limit ?? 10"
    [pageIndex]="(meta()?.page ?? 1) - 1"
    [pageSizeOptions]="[10, 25, 50, 100]"
    [actions]="actions"
    (pageChange)="onPage($event)"
    (sortChange)="onSort($event)"
    (retry)="load(meta()?.page ?? 1)"
  >
    <ng-template appDataTableCellDef="slika" let-row>
      @if ($any(row).slika?.url) {
        <img [src]="$any(row).slika.url | imageUrl" alt="" width="48" height="48" style="object-fit: cover; border-radius: 4px;" />
      }
    </ng-template>
  </app-data-table>
</div>
