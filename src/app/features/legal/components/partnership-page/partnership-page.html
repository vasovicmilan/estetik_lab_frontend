<div class="partnership-page">
  <h1>Partnerski program</h1>

  @if (loading()) {
    <div class="partnership-page__spinner">
      <mat-spinner diameter="40" />
    </div>
  } @else if (content(); as c) {
    <p class="partnership-page__intro" [innerHTML]="c.intro"></p>

    <ol class="partnership-page__steps">
      @for (step of c.steps; track step.number) {
        <li class="partnership-page__step">
          <span class="partnership-page__step-number">{{ step.number }}</span>
          <div class="partnership-page__step-body">
            <h3>{{ step.title }}</h3>
            <p [innerHTML]="step.description"></p>
          </div>
        </li>
      }
    </ol>

    <ul class="partnership-page__highlights">
      @for (highlight of c.highlights; track highlight) {
        <li>
          <mat-icon>check_circle</mat-icon>
          <span>{{ highlight }}</span>
        </li>
      }
    </ul>

    <a mat-flat-button color="primary" routerLink="/kontakt" class="partnership-page__cta"> Javite nam se </a>
  }
</div>
