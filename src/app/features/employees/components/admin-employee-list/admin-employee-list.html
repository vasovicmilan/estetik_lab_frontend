<div class="admin-employee-list">
  <div class="admin-employee-list__header">
    <h1>Zaposleni</h1>
    <a mat-flat-button color="primary" routerLink="/admin/zaposleni/novi">Novi zaposleni</a>
  </div>

  <table mat-table [dataSource]="rows()" class="admin-employee-list__table">
    <ng-container matColumnDef="imePrezime">
      <th mat-header-cell *matHeaderCellDef>Ime i prezime</th>
      <td mat-cell *matCellDef="let row">{{ row.imePrezime }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let row">{{ row.email ?? '-' }}</td>
    </ng-container>

    <ng-container matColumnDef="brojUsluga">
      <th mat-header-cell *matHeaderCellDef>Broj usluga</th>
      <td mat-cell *matCellDef="let row">{{ row.brojUsluga }}</td>
    </ng-container>

    <ng-container matColumnDef="aktivan">
      <th mat-header-cell *matHeaderCellDef>Aktivan</th>
      <td mat-cell *matCellDef="let row">{{ row.aktivan }}</td>
    </ng-container>

    <ng-container matColumnDef="kreiran">
      <th mat-header-cell *matHeaderCellDef>Kreiran</th>
      <td mat-cell *matCellDef="let row">{{ row.kreiran }}</td>
    </ng-container>

    <ng-container matColumnDef="akcije">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <a mat-button [routerLink]="['/admin/zaposleni', row.id, 'pregled']">Pregled</a>
        <a mat-button [routerLink]="['/admin/zaposleni', row.id]">Izmeni</a>
        <button mat-button color="warn" (click)="remove(row)">Obriši</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (!loading() && rows().length === 0) {
    <p class="admin-employee-list__empty">Nema zaposlenih.</p>
  }

  @if (loading()) {
    <div class="admin-employee-list__spinner">
      <mat-spinner diameter="32" />
    </div>
  }

  @if (meta(); as m) {
    <mat-paginator
      [length]="m.total"
      [pageSize]="m.limit"
      [pageIndex]="m.page - 1"
      (page)="onPage($event)"
    />
  }
</div>
