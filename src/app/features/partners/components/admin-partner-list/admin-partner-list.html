<div class="admin-partner-list">
  <div class="admin-partner-list__header">
    <h1>Partneri</h1>
    <a mat-flat-button color="primary" routerLink="/admin/partneri/novi">Novi partner</a>
  </div>

  <form [formGroup]="filterForm" class="admin-partner-list__filters">
    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select formControlName="isActive">
        @for (option of statusOptions; track option.value) {
          <mat-option [value]="option.value">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [error]="error()"
    emptyLabel="Nema partnera koji odgovaraju filterima."
    [totalCount]="meta()?.total ?? 0"
    [pageSize]="meta()?.limit ?? 10"
    [pageIndex]="(meta()?.page ?? 1) - 1"
    [pageSizeOptions]="[10, 25, 50, 100]"
    [defaultSort]="defaultSort"
    [actions]="actions"
    (pageChange)="onPage($event)"
    (sortChange)="onSort($event)"
    (retry)="load(meta()?.page ?? 1)"
  />
</div>
