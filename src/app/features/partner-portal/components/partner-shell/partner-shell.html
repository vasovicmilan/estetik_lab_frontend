<div class="partner-shell">
  <h1 class="partner-shell__title">Panel partnera</h1>

  <nav class="partner-shell__nav">
    <a
      routerLink="/partner-panel"
      routerLinkActive="partner-shell__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="partner-shell__link"
      >Pregled</a
    >
    <a routerLink="/partner-panel/zarade" routerLinkActive="partner-shell__link--active" class="partner-shell__link"
      >Provizije i isplate</a
    >
    <a routerLink="/partner-panel/katalog" routerLinkActive="partner-shell__link--active" class="partner-shell__link">Katalog</a>
  </nav>

  <div class="partner-shell__body">
    <router-outlet />
  </div>
</div>
