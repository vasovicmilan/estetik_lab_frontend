<div class="partner-shell">
  <h1 class="partner-shell__title">Panel partnera</h1>

  <nav mat-tab-nav-bar [tabPanel]="partnerTabPanel" class="partner-shell__nav">
    <a
      mat-tab-link
      routerLink="/partner-panel"
      routerLinkActive
      #pregledLink="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      [active]="pregledLink.isActive"
      >Pregled</a
    >
    <a mat-tab-link routerLink="/partner-panel/zarade" routerLinkActive #zaradeLink="routerLinkActive" [active]="zaradeLink.isActive"
      >Provizije i isplate</a
    >
    <a mat-tab-link routerLink="/partner-panel/katalog" routerLinkActive #katalogLink="routerLinkActive" [active]="katalogLink.isActive"
      >Katalog</a
    >
  </nav>

  <mat-tab-nav-panel #partnerTabPanel class="partner-shell__body">
    <router-outlet />
  </mat-tab-nav-panel>
</div>
