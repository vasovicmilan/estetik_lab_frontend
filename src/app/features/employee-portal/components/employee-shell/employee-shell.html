<div class="employee-shell">
  <h1 class="employee-shell__title">Panel zaposlenog</h1>

  <nav mat-tab-nav-bar [tabPanel]="employeeTabPanel" class="employee-shell__nav">
    <a
      mat-tab-link
      routerLink="/zaposleni-panel"
      routerLinkActive
      #pregledLink="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      [active]="pregledLink.isActive"
      >Pregled</a
    >
    <a mat-tab-link routerLink="/zaposleni-panel/termini" routerLinkActive #terminiLink="routerLinkActive" [active]="terminiLink.isActive"
      >Moji termini</a
    >
    <a mat-tab-link routerLink="/zaposleni-panel/profil" routerLinkActive #profilLink="routerLinkActive" [active]="profilLink.isActive"
      >Profil</a
    >
    @if (isCommissionBased()) {
      <a mat-tab-link routerLink="/zaposleni-panel/zarade" routerLinkActive #zaradeLink="routerLinkActive" [active]="zaradeLink.isActive"
        >Provizije</a
      >
    }
  </nav>

  <mat-tab-nav-panel #employeeTabPanel class="employee-shell__body">
    <router-outlet />
  </mat-tab-nav-panel>
</div>
