<div class="admin-business-partner-list">
  <div class="admin-business-partner-list__header">
    <h1>Poslovni saradnici</h1>
    <a mat-flat-button color="primary" routerLink="/admin/poslovni-saradnici/novi">Novi saradnik</a>
  </div>

  <form [formGroup]="filterForm" class="admin-business-partner-list__filters">
    <mat-form-field appearance="outline">
      <mat-label>Pretraga</mat-label>
      <input matInput formControlName="search" placeholder="Naziv..." />
    </mat-form-field>
  </form>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [error]="error()"
    emptyLabel="Nema poslovnih saradnika koji odgovaraju pretrazi."
    [totalCount]="meta()?.total ?? 0"
    [pageSize]="meta()?.limit ?? 10"
    [pageIndex]="(meta()?.page ?? 1) - 1"
    [pageSizeOptions]="[10, 25, 50, 100]"
    [defaultSort]="defaultSort"
    [actions]="actions"
    (pageChange)="onPage($event)"
    (sortChange)="onSort($event)"
    (retry)="load(meta()?.page ?? 1)"
  >
    <ng-template appDataTableCellDef="slika" let-row>
      @if ($any(row).slika?.url) {
        <img [src]="$any(row).slika.url | imageUrl" [alt]="$any(row).slika.alt || $any(row).naziv" width="48" height="48" style="object-fit: cover; border-radius: 4px;" />
      }
    </ng-template>
  </app-data-table>
</div>
