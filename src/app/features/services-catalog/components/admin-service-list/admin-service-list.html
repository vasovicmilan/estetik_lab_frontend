<div class="admin-service-list">
  <div class="admin-service-list__header">
    <h1>Usluge</h1>
    <div class="admin-service-list__header-actions">
      <a mat-stroked-button routerLink="/admin/kategorije">Upravljaj kategorijama</a>
      <a mat-flat-button color="primary" routerLink="/admin/usluge/nova">Nova usluga</a>
    </div>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [error]="error()"
    emptyLabel="Nema usluga."
    [totalCount]="meta()?.total ?? 0"
    [pageSize]="meta()?.limit ?? 10"
    [pageIndex]="(meta()?.page ?? 1) - 1"
    [pageSizeOptions]="[10, 25, 50, 100]"
    [actions]="actions"
    [searchable]="true"
    searchPlaceholder="Pretraga usluga..."
    (pageChange)="onPage($event)"
    (searchChange)="onSearch($event)"
    (sortChange)="onSort($event)"
    (retry)="load(meta()?.page ?? 1)"
  >
    <ng-template appDataTableCellDef="slika" let-row>
      @if ($any(row).slika?.url) {
        <img [src]="$any(row).slika.url | imageUrl" alt="" width="48" height="48" style="object-fit: cover; border-radius: 4px;" />
      }
    </ng-template>
  </app-data-table>
</div>
