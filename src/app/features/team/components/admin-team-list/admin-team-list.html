<div class="admin-team-list">
  <div class="admin-team-list__header">
    <h1>Tim</h1>
    <a mat-flat-button color="primary" routerLink="/admin/tim/novi">Novi član tima</a>
  </div>

  <table mat-table [dataSource]="rows()" class="admin-team-list__table">
    <ng-container matColumnDef="slika">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        @if (row.slika?.url) {
          <img [src]="row.slika.url | imageUrl" alt="" width="48" height="48" style="object-fit: cover; border-radius: 4px;" />
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="imePrezime">
      <th mat-header-cell *matHeaderCellDef>Ime i prezime</th>
      <td mat-cell *matCellDef="let row">{{ row.imePrezime }}</td>
    </ng-container>

    <ng-container matColumnDef="titula">
      <th mat-header-cell *matHeaderCellDef>Titula</th>
      <td mat-cell *matCellDef="let row">{{ row.titula }}</td>
    </ng-container>

    <ng-container matColumnDef="brojUsluga">
      <th mat-header-cell *matHeaderCellDef>Usluge</th>
      <td mat-cell *matCellDef="let row">{{ row.brojUsluga }}</td>
    </ng-container>

    <ng-container matColumnDef="aktivan">
      <th mat-header-cell *matHeaderCellDef>Aktivan</th>
      <td mat-cell *matCellDef="let row">{{ row.aktivan }}</td>
    </ng-container>

    <ng-container matColumnDef="akcije">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <a mat-button [routerLink]="['/admin/tim', row.id, 'pregled']">Pregled</a>
        <a mat-button [routerLink]="['/admin/tim', row.id]">Izmeni</a>
        <button mat-button color="warn" (click)="remove(row)">Obriši</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (loading()) {
    <div class="admin-team-list__spinner">
      <mat-spinner diameter="32" />
    </div>
  }

  @if (meta(); as m) {
    <mat-paginator
      [length]="m.total"
      [pageSize]="m.limit"
      [pageIndex]="m.page - 1"
      (page)="onPage($event)"
    />
  }
</div>
