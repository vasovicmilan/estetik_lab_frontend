<div class="admin-resource-list">
  <div class="admin-resource-list__header">
    <h1>Resursi</h1>
    <a mat-flat-button color="primary" routerLink="/admin/resursi/novi">Novi resurs</a>
  </div>

  <table mat-table [dataSource]="rows()" class="admin-resource-list__table">
    <ng-container matColumnDef="naziv">
      <th mat-header-cell *matHeaderCellDef>Naziv</th>
      <td mat-cell *matCellDef="let row">{{ row.naziv }}</td>
    </ng-container>

    <ng-container matColumnDef="kapacitet">
      <th mat-header-cell *matHeaderCellDef>Kapacitet</th>
      <td mat-cell *matCellDef="let row">{{ row.kapacitet }}</td>
    </ng-container>

    <ng-container matColumnDef="aktivan">
      <th mat-header-cell *matHeaderCellDef>Aktivan</th>
      <td mat-cell *matCellDef="let row">{{ row.aktivan }}</td>
    </ng-container>

    <ng-container matColumnDef="akcije">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <a mat-button [routerLink]="['/admin/resursi', row.id, 'pregled']">Pregled</a>
        <a mat-button [routerLink]="['/admin/resursi', row.id, 'izmena']">Izmeni</a>
        <button mat-button color="warn" (click)="remove(row)">Obriši</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (loading()) {
    <div class="admin-resource-list__spinner">
      <mat-spinner diameter="32" />
    </div>
  }

  @if (meta(); as m) {
    <mat-paginator
      [length]="m.total"
      [pageSize]="m.limit"
      [pageIndex]="m.page - 1"
      (page)="onPage($event)"
    />
  }
</div>
