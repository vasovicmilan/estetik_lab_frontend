<div class="admin-testimonial-list">
  <div class="admin-testimonial-list__header">
    <h1>Utisci klijenata</h1>
  </div>

  <form [formGroup]="filterForm" class="admin-testimonial-list__filters">
    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        @for (option of statusOptions; track option.value) {
          <mat-option [value]="option.value">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Istaknuto</mat-label>
      <mat-select formControlName="isFeatured">
        @for (option of featuredOptions; track option.value) {
          <mat-option [value]="option.value">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [error]="error()"
    emptyLabel="Nema utisaka koji odgovaraju filterima."
    [totalCount]="meta()?.total ?? 0"
    [pageSize]="meta()?.limit ?? 10"
    [pageIndex]="(meta()?.page ?? 1) - 1"
    [pageSizeOptions]="[10, 25, 50, 100]"
    [actions]="actions"
    (pageChange)="onPage($event)"
    (sortChange)="onSort($event)"
    (retry)="load(meta()?.page ?? 1)"
  >
    <ng-template appDataTableCellDef="slika" let-row>
      @if ($any(row).slika?.url) {
        <img [src]="$any(row).slika.url | imageUrl" [alt]="$any(row).slika.alt || $any(row).ime" width="40" height="40" style="object-fit: cover; border-radius: 50%;" />
      }
    </ng-template>
    <ng-template appDataTableCellDef="status" let-row>
      <span [class]="statusClass($any(row).statusRaw)">{{ $any(row).status }}</span>
    </ng-template>
  </app-data-table>
</div>
