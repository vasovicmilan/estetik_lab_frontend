<div class="admin-role-list">
  <div class="admin-role-list__header">
    <h1>Role</h1>
    <a mat-flat-button color="primary" routerLink="/admin/role/nova">Nova rola</a>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [error]="error()"
    emptyLabel="Nema rola."
    [totalCount]="meta()?.total ?? 0"
    [pageSize]="meta()?.limit ?? 10"
    [pageIndex]="(meta()?.page ?? 1) - 1"
    [pageSizeOptions]="[10, 25, 50, 100]"
    [defaultSort]="defaultSort"
    [actions]="actions"
    [searchable]="true"
    searchPlaceholder="Pretraga rola..."
    (pageChange)="onPage($event)"
    (searchChange)="onSearch($event)"
    (sortChange)="onSort($event)"
    (retry)="load(meta()?.page ?? 1)"
  />
</div>
