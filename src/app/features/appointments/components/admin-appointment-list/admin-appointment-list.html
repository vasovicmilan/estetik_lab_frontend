<div class="admin-appointment-list">
  <div class="admin-appointment-list__header">
    <h1>Zakazivanja</h1>
    <a mat-flat-button color="primary" routerLink="/admin/zakazivanja/novi">Novi termin</a>
  </div>

  <form [formGroup]="filterForm" class="admin-appointment-list__filters">
    <mat-form-field appearance="outline">
      <mat-label>Pretraga</mat-label>
      <input matInput formControlName="search" placeholder="Ime, email, telefon..." />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        @for (option of statusOptions; track option.value) {
          <mat-option [value]="option.value">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Od datuma</mat-label>
      <input matInput type="date" formControlName="dateFrom" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Do datuma</mat-label>
      <input matInput type="date" formControlName="dateTo" />
    </mat-form-field>

    <mat-checkbox formControlName="unassignedOnly">Samo nedodeljeni</mat-checkbox>
  </form>

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="loading()"
    [error]="error()"
    emptyLabel="Nema zakazivanja koja odgovaraju filterima."
    [totalCount]="meta()?.total ?? 0"
    [pageSize]="meta()?.limit ?? 10"
    [pageIndex]="(meta()?.page ?? 1) - 1"
    [pageSizeOptions]="[10, 25, 50, 100]"
    [defaultSort]="defaultSort"
    [actions]="actions"
    (pageChange)="onPage($event)"
    (sortChange)="onSort($event)"
    (retry)="load(meta()?.page ?? 1)"
  >
    <ng-template appDataTableCellDef="status" let-row>
      <span [class]="statusClass($any(row).statusRaw)">{{ $any(row).status }}</span>
    </ng-template>
  </app-data-table>
</div>
